<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Loro first run</title>
<style>
/* Layout: an iPhone 15 (393×852 pt) running the real flow at 1:1, a funnel column beside it that doubles as the screen index. */
:root {
  /* the app's own tokens (apps/mobile/src/onboarding/chrome.tsx, art.tsx, PlanArt.tsx) */
  --accent: #5ee6a8;
  --on-accent: #06130d;
  --text: #f2f5f3;
  --muted: rgba(242,245,243,0.6);
  --card: #141a17;
  --ground: #0a0d0b;
  --gold: #ffc44d;
  --rose: #ff8fa3;
  --pass: #f4f1e8;
  --pass-ink: #10231b;
  /* the page around the phone */
  --page: #070908;
  --panel: #0f1411;
  --line: rgba(242,245,243,0.09);
  --ink-soft: rgba(242,245,243,0.55);
  --sys: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.22,1,.36,1);
  color-scheme: dark;
}
[hidden] { display: none !important; }
body { background: var(--page); color: var(--text); font-family: var(--sys); }
button { font-family: var(--sys); }
.page {
  display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; align-items: flex-start;
  padding-block: 32px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ================================================================ phone */
.stage { flex: 0 0 auto; max-width: 100%; }
.device { width: 417px; height: 876px; border-radius: 66px; padding: 12px; background: #1b1f1d;
  box-shadow: 0 0 0 1.5px #2c322f, 0 40px 80px rgba(0,0,0,0.55); transform-origin: top left; }
.screen { position: relative; width: 393px; height: 852px; border-radius: 55px; overflow: hidden; background: var(--ground);
  font-family: var(--sys); -webkit-font-smoothing: antialiased; color: var(--text); user-select: none; }
.status { position: absolute; inset: 0 0 auto; height: 54px; z-index: 70; pointer-events: none; display: flex; justify-content: space-between;
  align-items: center; padding: 6px 34px 0 50px; font-size: 17px; font-weight: 600; letter-spacing: -0.2px; }
.island { position: absolute; top: 11px; left: 50%; width: 125px; height: 37px; margin-left: -62.5px; background: #000; border-radius: 20px; z-index: 71; }
.status .icons { display: flex; gap: 6px; align-items: center; }
.home { position: absolute; bottom: 8px; left: 50%; width: 139px; height: 5px; margin-left: -69.5px; border-radius: 3px; background: var(--text); z-index: 90; pointer-events: none; }
.backdrop { position: absolute; inset: 0; pointer-events: none; }
.wash { position: absolute; left: 0; right: 0; top: 0; height: 78%; }
.glow { position: absolute; }
.glow i { position: absolute; border-radius: 50%; background: rgba(94,230,168,0.072); }
.glow-smooth { position: absolute; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(94,230,168,0.31) 0%, rgba(94,230,168,0.258) 37.5%, rgba(94,230,168,0.2) 53.5%, rgba(94,230,168,0.139) 71%, rgba(94,230,168,0.072) 90%, rgba(94,230,168,0) 100%); }
.screen:not(.live) .glow { display: none; }
.screen.live .glow-smooth { display: none; }
.screen:not(.live) .freq-main, .screen.live .freq-branch { display: none; }
.mintile { width: 48px; height: 48px; border-radius: 14px; background: rgba(94,230,168,0.16); color: var(--accent); display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 0 0 auto; transition: background-color 240ms, color 240ms; }
.mintile b { font-size: 17px; font-weight: 800; letter-spacing: -0.4px; line-height: 19px; color: inherit; }
.mintile i { font-style: normal; font-size: 9px; font-weight: 900; letter-spacing: .8px; }
.choice.on .mintile { background: var(--accent); color: var(--on-accent); }
.choice .bdy { display: block; color: rgba(242,245,243,0.5); font-size: 13px; line-height: 18px; margin-top: 3px; }
.fopts { margin-top: 8px; }
button.reset { appearance: none; background: none; border: 0; padding: 0; color: inherit; cursor: pointer; text-align: inherit; }

/* ---- onboarding host */
.ob { position: absolute; inset: 0; display: flex; flex-direction: column; }
.chrome { display: flex; align-items: center; gap: 12px; padding: 67px 16px 10px; }
.side { width: 52px; height: 34px; display: flex; align-items: center; }
.back { font-size: 26px; font-weight: 700; line-height: 26px; color: rgba(242,245,243,0.6); padding: 4px 0; visibility: hidden; }
.back.on { visibility: visible; }
.track { flex: 1; height: 4px; border-radius: 999px; background: rgba(242,245,243,0.10); overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 999px; background: var(--accent); transition: width 420ms var(--ease); }
.viewport { flex: 1; overflow: hidden; position: relative; }
.row { display: flex; height: 100%; transition: transform 420ms var(--ease); }
.slide { width: 393px; flex: 0 0 393px; height: 100%; display: flex; flex-direction: column; position: relative; }
.slide .body { flex: 1; overflow-y: auto; scrollbar-width: none; padding: 24px; display: flex; flex-direction: column; }
.slide .body::-webkit-scrollbar { display: none; }
.slide .body > .center { margin-block: auto; }
.slide.lf .body { padding: 8px 24px 0; }
.foot { padding: 8px 24px 46px; }
.primary { appearance: none; border: 0; width: 100%; border-radius: 16px; padding: 16px 0; background: var(--accent); color: var(--on-accent);
  font-size: 17px; font-weight: 800; line-height: 20px; cursor: pointer; transition: opacity 150ms; }
.primary:disabled { opacity: 0.35; cursor: default; }
.primary:not(:disabled):active { opacity: 0.7; }
.t { color: var(--text); font-size: 26px; font-weight: 800; letter-spacing: -0.4px; line-height: 33px; text-wrap: balance; }

/* LoroSays */
.say { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 18px; }
.say-p { width: 52px; height: 78px; object-fit: contain; flex: 0 0 auto; }
.bob .say-p { animation: bob 3.6s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg) } 50% { transform: translateY(-4px) rotate(2deg) } }
.say-p.hop { animation: hop 400ms; }
@keyframes hop { 35% { transform: translateY(-12px) rotate(-6deg) } 100% { transform: none } }
.say-b { position: relative; flex: 1; min-height: 62px; margin-bottom: 14px; padding: 9px 13px; display: flex; flex-direction: column; justify-content: center;
  background: rgba(20,26,23,0.95); border: 1px solid rgba(94,230,168,0.3); border-radius: 18px; }
.say-b > i { position: absolute; bottom: 14px; left: -7px; width: 12px; height: 12px; transform: rotate(45deg); background: rgba(20,26,23,0.95);
  border-left: 1px solid rgba(94,230,168,0.3); border-bottom: 1px solid rgba(94,230,168,0.3); }
.say-l { animation: fade 220ms; }
.say-l b { display: block; font-size: 18px; font-weight: 800; }
.say-l span { display: block; color: var(--accent); opacity: 0.85; font-size: 13px; font-weight: 600; margin-top: 2px; }
@keyframes fade { from { opacity: 0 } }

/* 1. hook */
.logo { align-self: center; width: 113px; height: 56px; object-fit: contain; margin-bottom: 4px; }
.hero { position: relative; height: 400px; overflow: hidden; align-self: stretch; }
.lyr { position: absolute; left: 0; right: 0; top: 0; height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: transform var(--rl, 650ms) var(--ease), opacity var(--rl, 650ms) var(--ease); }
.lyr .words { display: flex; gap: 7px; white-space: nowrap; }
.hw { position: relative; font-size: 27px; font-weight: 800; letter-spacing: -0.4px; line-height: 36px; }
.hw .ink { display: block; padding: 0 4px; opacity: 0.38; }
.lit .hw .ink { opacity: 1; transition: opacity var(--t) linear var(--d); }
.hw .pill { position: absolute; inset: 0; border-radius: 10px; background: var(--accent); opacity: 0; transform: scale(.9); }
.hw .ink2 { position: absolute; left: 0; top: 0; padding: 0 4px; color: var(--on-accent); opacity: 0; }
.lit .hw .pill, .lit .hw .ink2 { opacity: 1; transform: none; transition: opacity 180ms var(--pill, 1080ms), transform 180ms var(--pill, 1080ms); }
.hw .gl { position: absolute; top: -20px; left: 50%; transform: translate(-50%, 4px); font-size: 13px; font-weight: 700; color: var(--accent); font-style: normal; white-space: nowrap; opacity: 0; line-height: 16px; }
.lit .hw .gl { opacity: 1; transform: translate(-50%, 0); transition: opacity 210ms var(--gl, 1140ms), transform 210ms var(--gl, 1140ms); }
.lyr .en { color: rgba(242,245,243,0.55); font-size: 15px; font-weight: 500; margin-top: 4px; opacity: 0; transition: opacity 200ms; white-space: nowrap; }
.lyr.lit.focus .en { opacity: 1; transition: opacity 300ms var(--en, 1200ms); }
.hook-t { font-size: 32px; font-weight: 800; letter-spacing: -0.6px; line-height: 38px; margin-top: 8px; text-align: center; }
.hook-b { color: var(--muted); font-size: 16px; line-height: 23px; margin-top: 10px; padding: 0 8px; text-align: center; }

/* 2. motivation tiles */
.mgrid { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
.mt { position: relative; width: 47.8%; aspect-ratio: 1; border-radius: 24px; border: 1.5px solid rgba(242,245,243,0.07); background: rgba(20,26,23,0.92);
  padding: 16px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; cursor: pointer; text-align: left;
  transition: background-color 240ms, border-color 240ms, transform 120ms; }
.mt:active { transform: scale(.98); }
.mt.on { background: rgba(94,230,168,0.12); border-color: rgba(94,230,168,0.6); }
.mt-mark { position: absolute; right: -24px; bottom: -26px; width: 120px; height: 120px; transform: rotate(-12deg); opacity: .07; transition: opacity 240ms; fill: var(--accent); }
.mt.on .mt-mark { opacity: .2; }
.mt-disc { width: 48px; height: 48px; border-radius: 999px; display: grid; place-items: center; background: rgba(94,230,168,0.14); transition: background-color 240ms; }
.mt-disc svg { width: 24px; height: 24px; fill: var(--accent); transition: fill 240ms; }
.mt.on .mt-disc { background: var(--accent); }
.mt.on .mt-disc svg { fill: var(--on-accent); }
.tick24 { position: absolute; right: 12px; top: 12px; width: 24px; height: 24px; border-radius: 999px; background: var(--accent); color: var(--on-accent);
  display: grid; place-items: center; font-size: 13px; font-weight: 900; opacity: 0; transform: scale(.6); transition: opacity 240ms, transform 240ms; }
.mt.on .tick24 { opacity: 1; transform: none; }
.mt b { display: block; font-size: 22px; font-weight: 800; letter-spacing: -0.4px; color: var(--text); transition: color 240ms; }
.mt.on b { color: var(--accent); }
.mt em, .es { display: block; color: rgba(94,230,168,0.75); font-size: 14px; font-style: italic; font-weight: 600; margin-top: 1px; }

/* 3. self level choice cards */
.choices { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
.choice { display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 18px; background: var(--card); border: 1px solid var(--card); cursor: pointer;
  transition: background-color 240ms, border-color 240ms, transform 90ms; text-align: left; width: 100%; }
.choice:active { transform: scale(.988); }
.choice.on { background: rgba(94,230,168,0.12); border-color: rgba(94,230,168,0.4); }
.itile { width: 44px; height: 44px; border-radius: 13.2px; display: grid; place-items: center; flex: 0 0 auto; transition: background-color 240ms; }
.bars { display: flex; align-items: flex-end; gap: 3px; }
.bars i { width: 5px; border-radius: 2px; }
.choice b { display: block; font-size: 16px; font-weight: 700; color: var(--text); transition: color 240ms; }
.choice.on b { color: var(--accent); }
.choice .es { font-size: 13px; color: rgba(94,230,168,0.7); }

/* 4. lesson intro */
.intro-t { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; line-height: 34px; text-wrap: balance; }
.timeline { position: relative; margin-top: 26px; }
.timeline .rail { position: absolute; left: 17px; top: 30px; bottom: 30px; width: 2px; background: rgba(94,230,168,0.25); }
.irow { display: flex; align-items: center; gap: 16px; padding: 12px 0; opacity: 0; transform: translateY(12px); position: relative; }
.on-stage .irow { opacity: 1; transform: none; transition: opacity 420ms cubic-bezier(.33,1,.68,1), transform 420ms cubic-bezier(.33,1,.68,1); }
.inum { width: 36px; height: 36px; border-radius: 999px; background: #10231b; border: 2px solid var(--accent); color: var(--accent); display: grid; place-items: center;
  font-size: 16px; font-weight: 900; flex: 0 0 auto; }
.irow b { display: block; font-size: 18px; font-weight: 800; }
.irow span { display: block; color: var(--muted); font-size: 14px; line-height: 19px; margin-top: 2px; }

/* 5–6. the lesson */
.kicker { color: var(--accent); font-size: 12px; font-weight: 900; letter-spacing: 1.4px; margin-bottom: 8px; text-transform: uppercase; }
.lt { color: rgba(242,245,243,0.82); font-size: 21px; font-weight: 700; letter-spacing: -0.2px; line-height: 27px; }
.quote { color: rgba(94,230,168,0.55); font-size: 64px; font-weight: 900; height: 40px; line-height: 72px; margin-top: 26px; text-align: center; overflow: visible; }
.line { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; column-gap: 6px; row-gap: 18px; margin-top: 4px; }
.lw { position: relative; font-size: 32px; font-weight: 800; letter-spacing: -0.5px; line-height: 42px; padding: 0 5px; color: var(--text); cursor: pointer; }
.lw .ink { opacity: .2; transition: opacity var(--t) linear var(--d); position: relative; }
.entered .lw .ink { opacity: 1; }
.lw.target .ink { color: var(--accent); }
.lw .halo { position: absolute; inset: 0; border-radius: 12px; background: rgba(94,230,168,0.14); border: 1.5px solid rgba(94,230,168,0.75); opacity: .25; }
.breathe .lw .halo { animation: breathe 1.7s ease-in-out 1.1s infinite; }
@keyframes breathe { 0%,100% { opacity: .4; transform: scale(1.012) } 50% { opacity: 1; transform: scale(1.06) } }
.lw.solid .halo { animation: none; background: var(--accent); border-color: var(--accent); opacity: 1; transform: none; }
.lw.solid .ink { color: var(--on-accent); }
.peek { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); color: var(--accent); font-size: 14px; font-weight: 800; white-space: nowrap; line-height: 18px; animation: fade 140ms; }
.under { color: var(--muted); font-size: 16px; font-weight: 500; margin-top: 16px; text-align: center; }
.wsheet { margin-top: 30px; padding: 18px; border-radius: 26px; background: rgba(242,245,243,0.06); animation: rise 320ms var(--ease); }
@keyframes rise { from { opacity: 0; transform: translateY(14px) } }
.wsheet .hd { display: flex; align-items: baseline; gap: 12px; }
.wsheet .hd b { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
.wsheet .hd span { color: var(--accent); font-size: 19px; font-weight: 700; }
.savebtn { margin-top: 16px; width: 100%; appearance: none; border: 0; border-radius: 16px; padding: 14px 0; background: var(--accent); color: var(--on-accent);
  font-size: 16px; font-weight: 800; display: flex; gap: 8px; align-items: center; justify-content: center; cursor: pointer; }
.saved-seat { margin-top: 30px; display: flex; flex-direction: column; align-items: center; }
.schip { position: relative; display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 14px; border-radius: 999px; background: rgba(94,230,168,0.12);
  border: 1px solid rgba(94,230,168,0.4); animation: rise 420ms var(--ease) 120ms both; }
.schip::after { content: ""; position: absolute; inset: 0; border-radius: 999px; border: 1.5px solid var(--accent); opacity: 0; animation: ring 900ms cubic-bezier(.33,1,.68,1) 260ms; }
@keyframes ring { 0% { opacity: 0 } 15% { opacity: .5 } 100% { opacity: 0; transform: scale(1.12, 1.45) } }
.schip b { font-size: 18px; font-weight: 800; }
.schip span { color: var(--muted); font-size: 15px; font-weight: 600; }
.schip em { margin-left: 6px; padding: 5px 10px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-style: normal; font-size: 13px; font-weight: 800; }
.after { color: var(--muted); font-size: 15px; line-height: 22px; margin-top: 16px; text-align: center; animation: fade 300ms 400ms both; }
.gapw { display: flex; flex-direction: column; align-items: center; margin: 0 2px; cursor: text; }
.gapw .gg { color: rgba(94,230,168,0.65); font-size: 13px; font-weight: 700; margin-bottom: 2px; line-height: 16px; }
.won .gapw .gg { color: var(--accent); }
.cellsw { position: relative; display: flex; gap: 3px; }
.cellsw .gpill, .cellsw .gring { position: absolute; left: -6px; right: -6px; top: 0; bottom: -2px; border-radius: 12px; background: var(--accent); opacity: 0; transform: scale(.92); }
.cellsw .gring { background: none; border: 1.5px solid var(--accent); border-radius: 14px; transform: none; }
.won .cellsw .gpill { opacity: 1; transform: none; transition: opacity 260ms 560ms, transform 260ms 560ms; }
.won .cellsw .gring { animation: ring2 900ms cubic-bezier(.33,1,.68,1) 700ms; }
@keyframes ring2 { 0% { opacity: 0 } 15% { opacity: .6 } 100% { opacity: 0; transform: scale(1.25, 1.6) } }
.cl { position: relative; width: 20px; display: flex; flex-direction: column; align-items: center; }
.cl b { font-size: 27px; font-weight: 800; line-height: 32px; min-height: 32px; color: var(--text); }
.cl i { width: 16px; height: 3px; border-radius: 2px; background: rgba(94,230,168,0.55); transition: background-color 700ms; }
.wrong .cl i { background: var(--rose); transition: none; }
.won .cl i { opacity: 0; transition: opacity 260ms 560ms; }
.abar { margin-top: 14px; display: flex; align-items: center; padding: 6px 6px 6px 16px; border-radius: 16px; background: var(--card); border: 1px solid rgba(94,230,168,0.35); }
.abar.shake { animation: shake 230ms; }
@keyframes shake { 20% { transform: translateX(-8px) } 45% { transform: translateX(8px) } 70% { transform: translateX(-5px) } }
.abar .field { flex: 1; font-size: 19px; font-weight: 700; padding: 8px 0; min-height: 23px; line-height: 23px; }
.abar .field .ph { color: rgba(242,245,243,0.35); }
.abar .field .caret { display: inline-block; width: 2px; height: 22px; background: var(--accent); vertical-align: -4px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0 } }
.go { width: 44px; height: 40px; border-radius: 12px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-size: 20px; font-weight: 800; border: 0; cursor: pointer; }
.go:disabled { opacity: .4; }
.help { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; color: var(--muted); font-size: 14px; }
.help strong { color: var(--accent); font-weight: 800; }
.tbtn { appearance: none; background: none; border: 0; cursor: pointer; padding: 10px 6px; color: var(--muted); font: 600 14px var(--sys); }
.cheer { margin-top: 26px; animation: rise 420ms var(--ease) 850ms both; }
.badge { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 20px; background: rgba(94,230,168,0.1); margin-top: 2px; }
.badge .disc { width: 34px; height: 34px; border-radius: 999px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-size: 17px; font-weight: 900; }
.badge b { display: block; font-size: 16px; font-weight: 800; }
.badge span { display: block; color: var(--muted); font-size: 14px; margin-top: 1px; }
.badge span strong { color: var(--accent); font-weight: 800; }

/* iOS keyboard, drawn */
.kbd { position: absolute; left: 0; right: 0; bottom: 0; z-index: 60; background: #2b2b2d; padding: 8px 3px 84px; transform: translateY(100%); transition: transform 300ms var(--ease); }
.kbd.up { transform: none; }
.kbd .kr { display: flex; justify-content: center; gap: 6px; margin-top: 11px; padding: 0 3px; }
.kbd .kr:first-child { margin-top: 0; }
.kbd button { appearance: none; border: 0; height: 42px; flex: 0 0 32.5px; border-radius: 5px; background: #6b6b6e; color: #fff; font: 400 23px var(--sys); cursor: pointer;
  box-shadow: 0 1px 0 rgba(0,0,0,.45); padding: 0; }
.kbd button.sp { background: #46464a; font-size: 16px; flex-basis: 45px; }
.kbd button.space { flex: 1 1 auto; font-size: 16px; }
.kbd button.done { background: #0a84ff; flex-basis: 88px; font-size: 16px; font-weight: 600; }
.kbd button:active { background: #8a8a8e; }

/* 7. topics */
.cloud { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
.tp { display: flex; align-items: center; gap: 10px; padding: 11px 20px 11px 16px; border-radius: 999px; border: 1.5px solid rgba(242,245,243,0.09);
  background: rgba(20,26,23,0.92); cursor: pointer; transition: background-color 240ms, border-color 240ms, transform 90ms; width: 100%; text-align: left; }
.tp:active { transform: scale(.97); }
.tp .g { width: 26px; text-align: center; font-size: 20px; font-weight: 700; color: var(--accent); transition: color 240ms; }
.tp b { display: block; font-size: 18px; font-weight: 800; letter-spacing: -0.3px; color: var(--text); transition: color 240ms; }
.tp em { display: block; font-size: 13px; font-style: italic; font-weight: 600; margin-top: -1px; color: rgba(94,230,168,0.75); transition: color 240ms; }
.tp.on { background: var(--accent); border-color: var(--accent); }
.tp.on .g, .tp.on b { color: var(--on-accent); }
.tp.on em { color: rgba(6,19,13,0.65); }

/* 8. frequency */
.week { margin-top: 18px; padding: 18px 14px; border-radius: 22px; background: rgba(20,26,23,0.9); border: 1px solid rgba(242,245,243,0.08); }
.days { display: flex; justify-content: space-between; }
.day { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.seat { position: relative; width: 40px; height: 40px; display: grid; place-items: center; }

  const state = { motivation: [], topics: [], selfLevel: null, derived: null, frequency: null, goalMonths: null };

  /* ------------------------------------------------------------ shared pieces */
  function say(line) {
    return `<div class="say"><img class="say-p" src="${PARROT}" alt="Loro the parrot"><div class="say-b"><i></i><div class="say-l"><b>${esc(line[0])}</b><span>${esc(line[1])}</span></div></div></div>`;
  }
  function setSay(slide, line) {
    const box = slide.querySelector('.say-b'), cur = box.querySelector('.say-l b');
    if (cur && cur.textContent === line[0]) return;
    box.querySelector('.say-l').remove();
    box.insertAdjacentHTML('beforeend', `<div class="say-l"><b>${esc(line[0])}</b><span>${esc(line[1])}</span></div>`);

  }
  const screenSlide = (body, foot) => h(`<section class="slide"><div class="body"><div class="center">${body}</div></div>${foot ? `<div class="foot">${foot}</div>` : ''}</section>`);
  const lessonSlide = (body, foot) => h(`<section class="slide lf"><div class="body">${body}</div><div class="foot">${foot}</div></section>`);
  const btn = (label, id, disabled) => `<button class="primary" type="button" ${id ? `id="${id}"` : 'data-next'} ${disabled ? 'disabled' : ''}>${esc(label)}</button>`;

  /* ============================================================ the steps (steps.tsx STEPS, benched ones left out) */
  const STEPS = [
    { id: 'hook', name: 'Hook', note: 'Understand real Spanish.', reached: 86, build: buildHook, arrive: (s) => hero.start(s), leave: () => hero.stop() },
    { id: 'motivation', name: 'Motivation', note: 'What’s pulling you toward Spanish?', reached: 80, build: buildMotivation },
    { id: 'selfLevel', name: 'Level', note: 'How much Spanish do you know already?', reached: 78, build: buildSelfLevel },
    { id: 'lessonIntro', name: 'Lesson intro', note: 'Learn your first word in 30 seconds.', reached: 78, build: buildLessonIntro },
    { id: 'tapWord', name: 'Tap the word', note: 'Mañana vamos a la playa', reached: 78, build: buildTapWord, arrive: arriveTap },
    { id: 'wordBack', name: 'Type it back', note: '¿Dónde está la ____?', reached: 76, build: buildWordBack, arrive: arriveBack, leave: () => kbd(false) },
    { id: 'topics', name: 'Topics', note: 'What do you love watching?', reached: 74, build: buildTopics },
    { id: 'frequency', name: 'Pace', note: 'How often do you want to practise?', reached: 74, build: buildFrequency },

  ];
  const row = $('row');
  let index = 0, onWall = false;
  let slides = [];

  function go(i, opts = {}) {
    i = Math.max(0, Math.min(STEPS.length - 1, i));
    const prev = STEPS[index];
    if (prev.leave && (i !== index || onWall)) prev.leave();
    if (onWall) closeWall();
    index = i;
    row.style.transition = opts.instant || reduced ? 'none' : '';
    row.style.transform = `translateX(${-i * W}px)`;
    $('trackFill').style.width = `${((i + 1) / STEPS.length) * 100}%`;
    $('back').classList.toggle('on', i > 0);
    slides.forEach((s, k) => { s.inert = k !== i; s.classList.toggle('on-stage', k === i); });
    if (STEPS[i].arrive) STEPS[i].arrive(slides[i]);
    renderPanel();
  }
  row.addEventListener('click', (e) => { if (e.target.closest('[data-next]')) go(index + 1); });
  $('back').onclick = () => go(index - 1);

  /* ------------------------------------------------------------ 1. hook + HookHero */
  const LYRICS = [
    { words: ['¿Qué', 'quieres', 'hacer', 'hoy?'], lit: 2, gloss: 'to do', en: 'What do you want to do today?' },
    { words: ['Me', 'encanta', 'esta', 'ciudad'], lit: 1, gloss: 'I love', en: 'I love this city' },
    { words: ['No', 'tengo', 'ni', 'idea'], lit: 1, gloss: 'I have', en: 'I have no idea' },
    { words: ['Vamos', 'a', 'tomar', 'algo'], lit: 2, gloss: 'to have', en: 'Let’s go for a drink' },
    { words: ['¿Dónde', 'está', 'el', 'baño?'], lit: 3, gloss: 'bathroom', en: 'Where is the bathroom?' },
    { words: ['Estoy', 'muy', 'cansado'], lit: 2, gloss: 'tired', en: 'I’m really tired' },
  ];
  function buildHook() {
    return screenSlide(`<img class="logo" src="${LOGO}" alt="Loro"><div class="hero" id="hero"></div>
      <div class="hook-t">Understand real Spanish.</div><div class="hook-b" id="hookBody" hidden>Learn from real people talking. Tap any word you don’t get.</div>`, `<button class="primary" type="button" data-next id="hookCta">Start</button>`);
  }
  const TIMING = { branch: { turn: 2400, roll: 500, lit: 800, cta: 'Start' }, main: { turn: 3600, roll: 650, lit: 1500, cta: 'Empezar', body: true } };
  let mode = 'branch';
  const hero = (() => {
    const ROW = 72, REACH = 3, HEIGHT = 400, rows = new Map();
    let focus = 0, timer = null, box = null;
    const T = () => TIMING[mode];
    const op = (d) => d === 0 ? 1 : d === 1 ? 0.32 : d === 2 ? 0.12 : 0;
    function lineEl(k) {
      const L = LYRICS[((k % LYRICS.length) + LYRICS.length) % LYRICS.length], n = L.words.length;
      const words = L.words.map((w, i) => {
        const tv = `--d:${Math.round((i / n) * 0.7 * T().lit)}ms;--t:${Math.round((0.7 / n) * T().lit)}ms`;
        return i === L.lit
          ? `<span class="hw" style="${tv}"><i class="pill"></i><span class="ink">${w}</span><span class="ink2">${w}</span><em class="gl">${L.gloss}</em></span>`
          : `<span class="hw" style="${tv}"><span class="ink">${w}</span></span>`;
      }).join('');
      return h(`<div class="lyr"><div class="words">${words}</div><div class="en">${L.en}</div></div>`);
    }
    function place(el, off) {
      const d = Math.abs(off);
      el.style.transform = `translateY(${HEIGHT / 2 + off * ROW - ROW / 2}px) scale(${d >= 1 ? 0.8 : 1})`;
      el.style.opacity = op(Math.min(d, REACH));
    }
    function layout(first) {
      for (let k = focus - REACH; k <= focus + REACH; k++) {
        let el = rows.get(k);
        if (!el) { el = lineEl(k); el.style.transition = 'none'; place(el, k - focus + 1); box.appendChild(el); rows.set(k, el); void el.offsetWidth; el.style.transition = ''; }
        place(el, k - focus);
        el.classList.toggle('focus', k === focus);
        if (k === focus && !el.classList.contains('lit')) setTimeout(() => el.classList.add('lit'), reduced ? 0 : T().roll * 0.4);
      }
      for (const [k, el] of rows) if (k < focus - REACH || k > focus + REACH) { el.remove(); rows.delete(k); }
    }
    return {
      start(slide) {
        box = slide.querySelector('#hero');
        const t = T();
        Object.entries({ '--rl': t.roll, '--pill': t.lit * 0.72, '--gl': t.lit * 0.76, '--en': t.lit * 0.8 }).forEach(([k, v]) => box.style.setProperty(k, Math.round(v) + 'ms'));
        if (!rows.size) layout(true);
        if (reduced || timer) return;
        timer = setInterval(() => { focus++; layout(); }, t.turn);
      },
      stop() { clearInterval(timer); timer = null; },
      reset() { this.stop(); for (const el of rows.values()) el.remove(); rows.clear(); focus = 0; },
    };
  })();

  /* ------------------------------------------------------------ 2. motivation */
  function buildMotivation() {
    const tiles = MOTIVES.map((m) => `<button class="mt" type="button" data-m="${m.id}" aria-pressed="false">
      <svg class="mt-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="${m.d}"/></svg>
      <span class="mt-disc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${m.d}"/></svg></span>
      <span class="tick24">✓</span><span><b>${m.en}</b><em>${m.es}</em></span></button>`).join('');
    const el = screenSlide(`${say(LORO.motivation.open)}<div class="t">What’s pulling you toward Spanish?</div><div class="mgrid">${tiles}</div>`, btn('Continuar'));
    el.classList.add('bob');
    const picked = [];
    el.querySelectorAll('.mt').forEach((b) => b.onclick = () => {
      const id = b.dataset.m, at = picked.indexOf(id);
      at >= 0 ? picked.splice(at, 1) : picked.push(id);
      b.classList.toggle('on', at < 0); b.setAttribute('aria-pressed', String(at < 0));
      const last = picked[picked.length - 1];
      setSay(el, (last && LORO.motivation[last]) || LORO.motivation.open);
      state.motivation = picked.slice(); renderPanel();
    });
    return el;
  }

  /* ------------------------------------------------------------ 3. self level */
  function bars(n, tint, on) {
    const lit = on ? '#06130d' : tint, dim = on ? 'rgba(6,19,13,0.3)' : hexA(tint, 0.3);
    return `<span class="bars">${[1, 2, 3].map((i) => `<i style="height:${6 + i * 5}px;background:${i <= n ? lit : dim}"></i>`).join('')}</span>`;
  }
  function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; }
  function buildSelfLevel() {
    const cards = LEVELS.map((l) => `<button class="choice" type="button" data-l="${l.id}" role="radio" aria-checked="false">
      <span class="itile" style="background:${hexA(l.tint, 0.16)}">${bars(l.bars, l.tint, false)}</span>
      <span style="flex:1"><b>${l.label}</b><span class="es">${l.es}</span></span></button>`).join('');
    const el = screenSlide(`${say(LORO.selfLevel.open)}<div class="t">How much Spanish do you know already?</div><div class="choices" role="radiogroup">${cards}</div>`);
    el.classList.add('bob');
    let leaving = false;
    el.querySelectorAll('.choice').forEach((b) => b.onclick = () => {
      if (leaving) return; leaving = true;
      const l = LEVELS.find((x) => x.id === b.dataset.l);
      el.querySelectorAll('.choice').forEach((o) => {
        const L = LEVELS.find((x) => x.id === o.dataset.l), on = o === b;
        o.classList.toggle('on', on); o.setAttribute('aria-checked', String(on));
        o.querySelector('.itile').style.background = on ? L.tint : hexA(L.tint, 0.16);
        o.querySelector('.itile').innerHTML = bars(L.bars, L.tint, on);
      });
      setSay(el, LORO.selfLevel[l.id]);
      setTimeout(() => { leaving = false; state.selfLevel = l.id; state.derived = l.start; go(index + 1); }, 650);
    });
    return el;
  }

  /* ------------------------------------------------------------ 4. lesson intro */
  function buildLessonIntro() {
    const steps = [['Tap it', 'Tap a word you don’t know and save it.'], ['It comes back', 'Loro brings it back in another video.'], ['It’s yours', 'Type it in, and you’ve got it.']];
    const rows = steps.map((s, i) => `<div class="irow" style="transition-delay:${250 + i * 220}ms"><span class="inum">${i + 1}</span><span style="flex:1"><b>${s[0]}</b><span>${s[1]}</span></span></div>`).join('');
    const el = screenSlide(`${say(['¡Vamos a probar!', 'Let’s try it!'])}<div class="intro-t">Learn your first word in 30 seconds.</div><div class="timeline"><i class="rail"></i>${rows}</div>`, btn('¡Vamos!'));
    el.classList.add('bob');
    return el;
  }

  /* ------------------------------------------------------------ 5. tap the word */
  const TAP_LINE = [['Mañana', 'tomorrow'], ['vamos', 'we’re going'], ['a', 'to'], ['la', 'the'], ['playa', 'beach', true]];
  const BOOKMARK = 'M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z';
  function buildTapWord() {
    const n = TAP_LINE.length;
    const words = TAP_LINE.map((w, i) => `<span class="lw${w[2] ? ' target' : ''}" data-i="${i}" role="button" tabindex="0" style="--d:${Math.round(250 + (i / n) * 0.8 * 900)}ms;--t:${Math.round((0.8 / n) * 900)}ms">${w[2] ? '<i class="halo"></i>' : ''}<span class="ink">${w[0]}</span></span>`).join('');
    const el = lessonSlide(`<div class="kicker" id="tapK">Step 1 of 3 · Tap it</div><div class="lt">Tap the word you don’t know.</div>
      <div class="quote">“</div><div class="line" id="tapLine">${words}</div><div class="under" id="tapUnder">Tap the glowing word. Others show their meaning too.</div><div id="tapMore"></div>`,
      btn('Tap the glowing word', 'tapNext', true));
    let phase = 'tap', peekT;
    el.querySelector('#tapLine').addEventListener('click', (e) => {
      const w = e.target.closest('.lw'); if (!w) return;
      const i = +w.dataset.i;
      if (TAP_LINE[i][2]) {
        if (phase !== 'tap') return;
        phase = 'sheet'; el.querySelectorAll('.peek').forEach((p) => p.remove());
        el.classList.remove('breathe');
        el.querySelector('#tapUnder').textContent = 'Tomorrow we’re going to the beach.';
        el.querySelector('#tapMore').innerHTML = `<div class="wsheet"><div class="hd"><b>playa</b><span>beach</span></div>
          <button class="savebtn" type="button" id="saveW"><svg width="18" height="18" viewBox="0 0 24 24"><path d="${BOOKMARK}" fill="#06130d"/></svg>Save word</button></div>`;
        el.querySelector('#saveW').onclick = () => {
          phase = 'saved';
          w.classList.add('solid');
          el.querySelector('#tapK').textContent = 'Step 2 of 3 · It comes back';
          el.querySelector('#tapMore').innerHTML = `<div class="saved-seat"><span class="schip"><svg width="18" height="18" viewBox="0 0 24 24"><path d="${BOOKMARK}" fill="#5ee6a8"/></svg><b>playa</b><span>beach</span><em>✓ Saved</em></span>
            <div class="after">Loro brings saved words back right before you’d forget them.</div></div>`;
          const b = el.querySelector('#tapNext'); b.disabled = false; b.textContent = 'Continuar'; b.onclick = () => go(index + 1);
        };
        return;
      }
      el.querySelectorAll('.peek').forEach((p) => p.remove());
      w.insertAdjacentHTML('beforeend', `<span class="peek">${TAP_LINE[i][1]}</span>`);
      clearTimeout(peekT); peekT = setTimeout(() => el.querySelectorAll('.peek').forEach((p) => p.remove()), 1600);
    });
    return el;
  }
  function arriveTap(slide) {
    requestAnimationFrame(() => slide.classList.add('entered'));
    if (!slide.querySelector('.lw.solid')) slide.classList.add('breathe');
  }

  /* ------------------------------------------------------------ 6. type it back + the drawn keyboard */
  function buildWordBack() {
    const cells = 'playa'.split('').map(() => '<span class="cl"><b></b><i></i></span>').join('');
    const el = lessonSlide(`<div class="kicker" id="bkK">Step 2 of 3 · It comes back</div><div class="lt" id="bkT">A few videos later, it comes back. Type it in.</div>
      <div><div class="quote">“</div><div class="line" id="bkLine"><span class="lw">¿Dónde</span><span class="lw">está</span><span class="lw">la</span>
        <span class="gapw" id="gap"><span class="gg">beach</span><span class="cellsw"><i class="gring"></i><i class="gpill"></i>${cells}</span></span><span class="lw" style="margin-left:-6px">?</span></div>
      <div class="under">Where is the beach?</div>
      <div class="abar" id="abar"><div class="field" id="field"></div><button class="go" id="goBtn" type="button" aria-label="Check" disabled>→</button></div>
      <div id="help"></div><div id="cheer"></div></div>`,
      btn('Type the word above', 'bkNext', true));
    return el;
  }
  const back = { typed: '', tries: 0, won: false, focused: false };
  function renderBack() {
    const el = slides[5];
    const shown = back.won ? 'playa' : back.typed;
    el.querySelectorAll('.cl b').forEach((b, i) => { b.textContent = shown[i] || ''; });
    const f = el.querySelector('#field');
    if (f) f.innerHTML = back.typed ? `${esc(back.typed)}${back.focused ? '<span class="caret"></span>' : ''}` : `${back.focused ? '<span class="caret"></span>' : ''}<span class="ph">Type the Spanish word</span>`;
    const go_ = el.querySelector('#goBtn'); if (go_) go_.disabled = !back.typed.trim();
  }
  function norm(s) { return s.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function submitBack() {
    const el = slides[5];
    if (back.won || !back.typed.trim()) return;
    if (norm(back.typed) === 'playa') return winBack(false);
    back.tries++;
    const line = el.querySelector('#bkLine'); line.classList.add('wrong'); setTimeout(() => line.classList.remove('wrong'), 30);
    const bar = el.querySelector('#abar'); bar.classList.remove('shake'); void bar.offsetWidth; bar.classList.add('shake');
    el.querySelector('#help').innerHTML = `<div class="help"><span>Almost. It starts with <strong>p</strong>${back.tries >= 2 ? '. Or let Loro show you.' : '.'}</span>${back.tries >= 2 ? '<button class="tbtn" type="button" id="reveal">Show me</button>' : ''}</div>`;
    const r = el.querySelector('#reveal'); if (r) r.onclick = () => winBack(true);
  }
  function winBack(revealed) {
    const el = slides[5];
    back.won = true; kbd(false); back.focused = false;
    el.querySelector('#abar').remove(); el.querySelector('#help').innerHTML = '';
    el.querySelector('#bkK').textContent = 'All 3 steps done';
    el.querySelector('#bkT').textContent = 'That’s how Loro works.';
    const line = el.querySelector('#bkLine'); line.classList.add('won');
    renderBack();
    const cells = [...el.querySelectorAll('.cl b')], t0 = performance.now();
    (function wave() {
      const t = Math.min(1, (performance.now() - t0) / 600), pillOn = performance.now() - t0 > 690;
      cells.forEach((c, i) => {
        const local = Math.min(1, Math.max(0, t * 5 - i));
        c.style.transform = `translateY(${-Math.sin(local * Math.PI) * 8}px)`;
        c.style.color = pillOn ? '#06130d' : local > 0 ? '#5ee6a8' : '';
      });
      if (performance.now() - t0 < 900) requestAnimationFrame(wave);
    })();
    const line2 = revealed ? ['¡Eso es! Ahora es tuya.', 'That’s it! Now it’s yours.'] : ['¡Muy bien! ¡Perfecto!', 'Very good! Perfect!'];
    el.querySelector('#cheer').innerHTML = `<div class="cheer bob">${say(line2)}<div class="badge"><span class="disc">✓</span><span style="flex:1"><b>Your first Spanish word</b><span><strong>playa</strong> · beach</span></span></div></div>`;
    const b = el.querySelector('#bkNext'); b.disabled = false; b.textContent = 'Continuar'; b.onclick = () => go(index + 1);
  }
  function arriveBack(slide) {
    slide.querySelector('#gap').onclick = () => { if (!back.won) { back.focused = true; kbd(true); renderBack(); } };
    const f = slide.querySelector('#abar'); if (f) f.onclick = (e) => { if (e.target.id === 'goBtn') return submitBack(); back.focused = true; kbd(true); renderBack(); };
    renderBack();
    if (!back.won) setTimeout(() => { if (STEPS[index].id === 'wordBack' && !onWall) { back.focused = true; kbd(true); renderBack(); } }, 480);
  }
  const KB = $('kbd');
  KB.innerHTML = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'].map((r, ri) => `<div class="kr">${ri === 2 ? '<button class="sp" data-k="shift">⇧</button>' : ''}${r.split('').map((c) => `<button data-k="${c}">${c}</button>`).join('')}${ri === 2 ? '<button class="sp" data-k="del">⌫</button>' : ''}</div>`).join('')
    + '<div class="kr"><button class="sp" data-k="">123</button><button class="sp" data-k="">🙂</button><button class="space" data-k=" ">space</button><button class="done" data-k="done">done</button></div>';
  KB.addEventListener('mousedown', (e) => e.preventDefault());
  KB.addEventListener('click', (e) => { const k = e.target.closest('button'); if (k) key(k.dataset.k); });
  function key(k) {
    if (back.won) return;
    if (k === 'done') return submitBack();
    if (k === 'del') back.typed = back.typed.slice(0, -1);
    else if (k && k !== 'shift' && back.typed.length < 14) back.typed += k;
    renderBack();
  }
  function kbd(on) { KB.classList.toggle('up', on); KB.setAttribute('aria-hidden', String(!on)); }
  addEventListener('keydown', (e) => {
    if (onWall || STEPS[index].id !== 'wordBack' || back.won || e.metaKey || e.ctrlKey) return;
    if (e.key === 'Enter') { e.preventDefault(); submitBack(); }
    else if (e.key === 'Backspace') { e.preventDefault(); key('del'); }
    else if (e.key.length === 1) { e.preventDefault(); back.focused = true; kbd(true); key(e.key); }
  });

  /* ------------------------------------------------------------ 7. topics */
  function buildTopics() {
    const pills = TOPICS.map((t) => `<button class="tp" type="button" data-t="${t.id}" aria-pressed="false"><span class="g">${t.g}</span><span><b>${t.pill}</b><em>${t.es}</em></span></button>`).join('');

  /* ------------------------------------------------------------ 8. frequency */
  function buildFrequency() {
    const days = ['M', 'T', 'W', 'T', 'F', 'S', 'S'].map((d) => `<span class="day"><span class="seat"><i class="halo2"></i><span class="dot"><span>✓</span></span></span><small>${d}</small></span>`).join('');
    const cols = FREQ.map((f) => `<button class="col" type="button" data-f="${f.id}" role="radio" aria-checked="false"><span class="n">${f.minutes}</span><span class="u">MIN</span><span class="l">${f.label}</span><span class="es">${f.es}</span></button>`).join('');
    const BODY = { light: 'About 5 minutes.', daily: 'About 10 minutes.', serious: '20 minutes or more.' };
    const cards = FREQ.map((f) => `<button class="choice" type="button" data-f="${f.id}" role="radio" aria-checked="false"><span class="mintile"><b>${f.minutes}</b><i>MIN</i></span>
      <span style="flex:1"><b>${f.label}</b><span class="es">${f.es}</span></span></button>`).join('');

      el.querySelector('#sK').style.transform = `translateX(${p * 345}px)`;

    sl.addEventListener('pointerdown', (e) => { sl.setPointerCapture(e.pointerId); set(fromX(e)); });
    sl.addEventListener('pointermove', (e) => { if (sl.hasPointerCapture(e.pointerId)) set(fromX(e)); });

    const stage = $('stage'), dev = $('device'), avail = Math.min(stage.parentElement.clientWidth - 32, 417), s = Math.min(1, avail / 417);
    dev.style.transform = s < 1 ? `scale(${s})` : ''; stage.style.width = 417 * s + 'px'; stage.style.height = 876 * s + 'px';
  }
  addEventListener('resize', fit); fit();
  slides = STEPS.map((s) => { const el = s.build(); el.dataset.step = s.id; row.appendChild(el); return el; });
  if (EMBED) setMode('main');
  const start = STEPS.findIndex((s) => s.id === location.hash.slice(1));
  go(start > 0 ? start : 0, { instant: true });
  if (location.hash === '#paywall') openWall();
})();
</script>
